# Publish the crate to crates.io on a release tag.
#
# This is NOT part of release.yml, and cannot be: that file is generated by
# `dist generate` and `dist plan` fails CI if its contents drift. cargo-dist
# distributes binaries — its only publish job is the Homebrew formula — so
# nothing in it ever touched crates.io.
#
# Which is how `cargo install code-context` came to serve 0.23.0 for three
# weeks. 0.24.0 and 0.25.0 were tagged, built and released on GitHub, and
# simply never published, because publishing was a step someone had to
# remember. One of three documented install paths was two minor versions
# behind, handing people a `ctx snippet` that reports 21% recall and advises
# distrusting the tool.
name: Publish crate

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # A tag that disagrees with Cargo.toml publishes the wrong version under
      # the right name, and crates.io cannot be unpublished — only yanked, with
      # the version number burned either way. Refuse before that, not after.
      - name: Tag must match Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      # crates.io rejects a bad token with a 401 at UPLOAD — after packaging
      # and a full verification build — and the message reads as "failed to
      # publish" when it means "your token is wrong". That happened on the
      # first real tag and cost two confused re-runs.
      #
      # /api/v1/me is read-only and answers the same question in two seconds,
      # with no side effect and nothing published either way. crates.io also
      # requires a User-Agent and 403s without one.
      - name: Token is accepted by crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on this repository" >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: $CARGO_REGISTRY_TOKEN" \
            -H 'User-Agent: ctx-release (https://github.com/Eagle-Logic/context)' \
            https://crates.io/api/v1/me)
          if [ "$code" != "200" ]; then
            echo "::error::crates.io rejected the token (HTTP $code). Generate a new one at https://crates.io/me scoped to publish-update, then: gh secret set CARGO_REGISTRY_TOKEN --repo Eagle-Logic/context" >&2
            exit 1
          fi
          echo "crates.io accepted the token"

      # --locked so the published crate builds against the lockfile that was
      # tested, not whatever resolves on the day.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
