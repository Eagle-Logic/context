# Publish the crate to crates.io on a release tag.
#
# This is NOT part of release.yml, and cannot be: that file is generated by
# `dist generate` and `dist plan` fails CI if its contents drift. cargo-dist
# distributes binaries — its only publish job is the Homebrew formula — so
# nothing in it ever touched crates.io.
#
# Which is how `cargo install code-context` came to serve 0.23.0 for three
# weeks. 0.24.0 and 0.25.0 were tagged, built and released on GitHub, and
# simply never published, because publishing was a step someone had to
# remember. One of three documented install paths was two minor versions
# behind, handing people a `ctx snippet` that reports 21% recall and advises
# distrusting the tool.
name: Publish crate

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # Manual retry, for when the tag is already pushed and the failure was in
  # this workflow rather than in the crate. Dispatch runs the file from the
  # DEFAULT BRANCH, which is the point: a fix here is usable immediately
  # instead of needing the tag moved. Publishes whatever version the checked
  # out Cargo.toml declares.
  workflow_dispatch:

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # A tag that disagrees with Cargo.toml publishes the wrong version under
      # the right name, and crates.io cannot be unpublished — only yanked, with
      # the version number burned either way. Refuse before that, not after.
      - name: Tag must match Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      # crates.io rejects a bad token with a 401 at UPLOAD — after packaging
      # and a full verification build — and the message reads as "failed to
      # publish" when it means "your token is wrong". That happened on the
      # first real tag and cost two confused re-runs.
      #
      # /api/v1/me is read-only and answers the same question in two seconds,
      # with no side effect and nothing published either way. crates.io also
      # requires a User-Agent and 403s without one.
      - name: Token is accepted by crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on this repository" >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: $CARGO_REGISTRY_TOKEN" \
            -H 'User-Agent: ctx-release (https://github.com/Eagle-Logic/context)' \
            https://crates.io/api/v1/me)
          case "$code" in
            200)
              echo "crates.io accepted the token"
              ;;
            403)
              # NOT a bad token. 403 on this endpoint means crates.io treated
              # the request as unauthenticated FOR THIS ACTION, and that is
              # what an endpoint-scoped token gets: a token scoped to
              # publish-update is not permitted to read account details, so
              # /api/v1/me answers 403 while `cargo publish` would succeed.
              #
              # This check shipped asserting "no credential gives 403, a
              # malformed one gives 401, only a valid token gives 200" — all
              # three verified, and none of them a SCOPED token, which is the
              # kind crates.io recommends creating. The result was that the
              # 0.27.0 publish was blocked by its own pre-flight check while
              # the token was fine.
              #
              # So 403 is inconclusive and must not fail: the publish itself
              # is the only authority on whether the scope is sufficient.
              echo "::notice::crates.io returned 403 for /api/v1/me — expected for a scoped token, which cannot read account details. Proceeding; the publish is the real test."
              ;;
            401)
              # Unambiguous: the credential was read and rejected. This is the
              # case that cost two confused re-runs, where the message read
              # "failed to publish" and meant "your token is malformed".
              echo "::error::crates.io rejected the token as invalid (HTTP 401). Generate a new one at https://crates.io/settings/tokens scoped to publish-update, then: gh secret set CARGO_REGISTRY_TOKEN --repo Eagle-Logic/context" >&2
              exit 1
              ;;
            *)
              echo "::error::unexpected HTTP $code from crates.io /api/v1/me; refusing to publish blind" >&2
              exit 1
              ;;
          esac

      # --locked so the published crate builds against the lockfile that was
      # tested, not whatever resolves on the day.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # Announce the crate to the official MCP registry.
  #
  # The registry hosts no artifacts. It stores metadata pointing at crates.io
  # and then verifies the claim, which is why this job NEEDS the publish above:
  # it fetches the crate's rendered README from crates.io's CDN and looks for
  # an `mcp-name:` token matching server.json. Run before the version exists
  # there, it fails on a crate it cannot see.
  #
  # Worth having at all because the registry is the fan-out point: the
  # third-party MCP directories mirror it, so one entry here is the difference
  # between a tool that is listed and a tool nobody can find. ctx was in none
  # of them.
  mcp-registry:
    name: publish to the MCP registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # OIDC, and not a token, for a specific reason: `mcp-publisher login
      # github` CANNOT reach an organization namespace. Its device flow
      # authenticates against a GitHub App, GitHub App user tokens cannot read
      # org memberships, so the registry sees no org this account owns and
      # grants only the personal namespace — regardless of role. The name here
      # is `io.github.Eagle-Logic/ctx`, an org namespace, so the interactive
      # path cannot publish it at all. OIDC carries the repository's own
      # identity and is unaffected.
      # https://github.com/modelcontextprotocol/registry/issues/1468
      id-token: write
      contents: read
    env:
      # Pinned deliberately, with the Sigstore bundle verified below. Not
      # `releases/latest`, which is mutable: this job holds a token that can
      # publish under the whole org namespace, so the binary that uses it is
      # not fetched from a moving target.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7

      # Same reasoning as "Tag must match Cargo.toml" above, for the file the
      # registry reads. Also asserts the ownership token is visible markdown
      # rather than an HTML comment — crates.io strips comments, so the
      # commented form documented for PyPI and NuGet renders to nothing here.
      - name: server.json must be current
        run: python3 scripts/check-server-json.py

      # On a tag, the tag is the authority. The committed server.json is
      # checked against Cargo.toml above, so this is belt-and-braces rather
      # than a fixup — but the registry version is not something to leave to a
      # file someone has to remember to edit.
      - name: Set version from the tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | (.packages[] | select(.registryType == "cargo") | .version) |= $v' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '"publishing \(.name) \(.version)"' server.json

      # crates.io serves the rendered README from a CDN, so the version this
      # workflow just published is not necessarily readable yet. The registry
      # fetching it too early fails verification on a crate that is perfectly
      # fine, so wait for the version to actually be visible rather than
      # sleeping a guessed interval.
      - name: Wait for crates.io to serve the new version
        run: |
          set -euo pipefail
          version=$(jq -r '.version' server.json)
          for attempt in $(seq 1 30); do
            found=$(curl -sS \
              -H 'User-Agent: ctx-release (https://github.com/Eagle-Logic/context)' \
              "https://crates.io/api/v1/crates/code-context/$version" \
              | jq -r '.version.num // empty')
            if [ "$found" = "$version" ]; then
              echo "crates.io is serving $version"
              exit 0
            fi
            echo "attempt $attempt: crates.io does not serve $version yet"
            sleep 10
          done
          echo "::error::crates.io never served $version; the registry would fail ownership verification" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
