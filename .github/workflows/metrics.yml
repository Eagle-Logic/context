name: Metrics snapshot

# GitHub's traffic API retains only 14 days. Anything not captured before it
# rolls off is gone for good — there is no backfill — so this runs daily and
# appends to a log rather than reading the API on demand.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily; off the hour to dodge the cron stampede
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # Needed for the append step: without a checkout the workspace is not a
      # git repo at all, and `git` fails with "not in a git directory".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect
        env:
          # Traffic endpoints require push-level auth, which the default
          # GITHUB_TOKEN does not grant — it returns 403 and the traffic
          # fields land as null. METRICS_TOKEN is a PAT with read access to
          # this repo; without it everything else is still captured, but the
          # views/clones/referrers numbers (the ones that expire) are lost.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p raw

          # Traffic endpoints need push-level auth. If that ever stops working
          # the job must still record the rest rather than failing silently, so
          # each fetch degrades to `null` in a file instead of aborting the run.
          #
          # Responses go to FILES, not environment variables: the releases
          # payload alone is tens of KB and passing it through the environment
          # overflows the exec argument limit ("Argument list too long").
          # Degrade to null rather than aborting, but say so — a silent null
          # here is indistinguishable from a genuine zero, and these numbers
          # cannot be backfilled.
          fetch () {
            if gh api "$1" > "raw/$2" 2>raw/err; then
              return 0
            fi
            echo "::warning::could not fetch $1 — recording null. $(head -c 200 raw/err)"
            echo 'null' > "raw/$2"
          }
          fetch "repos/$REPO/traffic/views"            views.json
          fetch "repos/$REPO/traffic/clones"           clones.json
          fetch "repos/$REPO/traffic/popular/referrers" refs.json
          fetch "repos/$REPO/traffic/popular/paths"     paths.json
          fetch "repos/$REPO"                           repo.json
          fetch "repos/$REPO/releases?per_page=100"     releases.json
          # crates.io rejects requests without a User-Agent.
          curl -sS -H 'User-Agent: ctx-metrics (github.com/Eagle-Logic/context)' \
            https://crates.io/api/v1/crates/code-context > raw/crate.json \
            2>/dev/null || echo 'null' > raw/crate.json

          python3 - <<'PY' > snapshot.json
          import json, datetime

          def load(name):
              try:
                  with open(f"raw/{name}") as f:
                      return json.load(f)
              except Exception:
                  return None

          repo     = load("repo.json") or {}
          views    = load("views.json") or {}
          clones   = load("clones.json") or {}
          crate    = load("crate.json") or {}
          releases = load("releases.json") or []

          # Per-platform asset counts are the point: they say whether the
          # six-target build matrix was worth having, and which platforms to
          # lead with in the README.
          assets = {}
          for r in releases if isinstance(releases, list) else []:
              for a in r.get("assets", []):
                  if a["name"].endswith(".sha256"):
                      continue
                  assets[f'{r.get("tag_name")}/{a["name"]}'] = a.get("download_count", 0)

          c = crate.get("crate") or {}
          out = {
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "stars": repo.get("stargazers_count"),
              "watchers": repo.get("subscribers_count"),
              "forks": repo.get("forks_count"),
              "open_issues": repo.get("open_issues_count"),
              # `uniques` is the number that means something; `count` inflates
              # with refreshes.
              "views_14d": views.get("count"),
              "view_uniques_14d": views.get("uniques"),
              "clones_14d": clones.get("count"),
              "clone_uniques_14d": clones.get("uniques"),
              "referrers": load("refs.json"),
              "popular_paths": load("paths.json"),
              "crate_downloads_total": c.get("downloads"),
              "crate_downloads_recent": c.get("recent_downloads"),
              "crate_versions": {v["num"]: v["downloads"] for v in (crate.get("versions") or [])},
              "release_assets": assets,
          }
          print(json.dumps(out, sort_keys=True))
          PY
          rm -rf raw
          cat snapshot.json
          python3 -c "
          import json
          d = json.load(open('snapshot.json'))
          if d.get('view_uniques_14d') is None:
              print('::warning::traffic data is null — set a METRICS_TOKEN secret '
                    '(a PAT with read access to this repo) or the 14-day view/clone '
                    'numbers will expire uncaptured')
          "

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A dedicated branch, because `main` is protected and a daily bot
          # commit has no business in the project's history anyway.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics --depth=1 2>/dev/null && git checkout metrics \
            || git checkout --orphan metrics
          git rm -rq --cached . 2>/dev/null || true
          [ -f metrics.jsonl ] || : > metrics.jsonl
          # One line per day. A re-run replaces that day — but only if it is
          # not throwing away data.
          #
          # Learned the hard way: a run without traffic auth writes nulls, and
          # unconditional replacement let one of those silently destroy a
          # hand-seeded row that had real numbers in it. Traffic cannot be
          # backfilled, so that loss was permanent and invisible. A replacement
          # now has to be at least as complete as what it overwrites.
          python3 - <<'PY'
          import json, os

          new = json.load(open("snapshot.json"))
          rows = []
          if os.path.exists("metrics.jsonl"):
              with open("metrics.jsonl") as f:
                  rows = [json.loads(l) for l in f if l.strip()]

          TRAFFIC = ("views_14d", "view_uniques_14d", "clones_14d", "clone_uniques_14d")
          def filled(r):
              return sum(1 for k in TRAFFIC if r.get(k) is not None)

          prior = next((r for r in rows if r.get("date") == new["date"]), None)
          if prior is not None and filled(prior) > filled(new):
              # Keep the richer row, but carry over anything the new run did
              # learn that the old one lacked.
              for k, v in new.items():
                  if v is not None and prior.get(k) is None:
                      prior[k] = v
              print(f"::warning::keeping existing {new['date']} row — it has traffic data "
                    f"this run could not fetch; merged in the non-traffic fields")
              new = prior

          rows = [r for r in rows if r.get("date") != new["date"]] + [new]
          rows.sort(key=lambda r: r.get("date") or "")
          with open("metrics.jsonl", "w") as f:
              for r in rows:
                  f.write(json.dumps(r, sort_keys=True) + "\n")
          PY
          # Read the date BEFORE snapshot.json is removed. The previous version
          # of this step set `day` earlier and the rewrite dropped that line
          # while leaving the reference below, so `set -u` killed the job after
          # the data had already been collected.
          day=$(python3 -c "import json;print(json.load(open('snapshot.json'))['date'])")
          rm -f snapshot.json
          git add metrics.jsonl
          git commit -qm "metrics: $day" || { echo "nothing changed"; exit 0; }
          git push -q origin metrics
