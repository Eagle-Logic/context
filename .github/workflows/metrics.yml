name: Metrics snapshot

# GitHub's traffic API retains only 14 days. Anything not captured before it
# rolls off is gone for good — there is no backfill — so this runs daily and
# appends to a log rather than reading the API on demand.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily; off the hour to dodge the cron stampede
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # Needed for the append step: without a checkout the workspace is not a
      # git repo at all, and `git` fails with "not in a git directory".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p raw

          # Traffic endpoints need push-level auth. If that ever stops working
          # the job must still record the rest rather than failing silently, so
          # each fetch degrades to `null` in a file instead of aborting the run.
          #
          # Responses go to FILES, not environment variables: the releases
          # payload alone is tens of KB and passing it through the environment
          # overflows the exec argument limit ("Argument list too long").
          fetch () { gh api "$1" > "raw/$2" 2>/dev/null || echo 'null' > "raw/$2"; }
          fetch "repos/$REPO/traffic/views"            views.json
          fetch "repos/$REPO/traffic/clones"           clones.json
          fetch "repos/$REPO/traffic/popular/referrers" refs.json
          fetch "repos/$REPO/traffic/popular/paths"     paths.json
          fetch "repos/$REPO"                           repo.json
          fetch "repos/$REPO/releases?per_page=100"     releases.json
          # crates.io rejects requests without a User-Agent.
          curl -sS -H 'User-Agent: ctx-metrics (github.com/Eagle-Logic/context)' \
            https://crates.io/api/v1/crates/code-context > raw/crate.json \
            2>/dev/null || echo 'null' > raw/crate.json

          python3 - <<'PY' > snapshot.json
          import json, datetime

          def load(name):
              try:
                  with open(f"raw/{name}") as f:
                      return json.load(f)
              except Exception:
                  return None

          repo     = load("repo.json") or {}
          views    = load("views.json") or {}
          clones   = load("clones.json") or {}
          crate    = load("crate.json") or {}
          releases = load("releases.json") or []

          # Per-platform asset counts are the point: they say whether the
          # six-target build matrix was worth having, and which platforms to
          # lead with in the README.
          assets = {}
          for r in releases if isinstance(releases, list) else []:
              for a in r.get("assets", []):
                  if a["name"].endswith(".sha256"):
                      continue
                  assets[f'{r.get("tag_name")}/{a["name"]}'] = a.get("download_count", 0)

          c = crate.get("crate") or {}
          out = {
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "stars": repo.get("stargazers_count"),
              "watchers": repo.get("subscribers_count"),
              "forks": repo.get("forks_count"),
              "open_issues": repo.get("open_issues_count"),
              # `uniques` is the number that means something; `count` inflates
              # with refreshes.
              "views_14d": views.get("count"),
              "view_uniques_14d": views.get("uniques"),
              "clones_14d": clones.get("count"),
              "clone_uniques_14d": clones.get("uniques"),
              "referrers": load("refs.json"),
              "popular_paths": load("paths.json"),
              "crate_downloads_total": c.get("downloads"),
              "crate_downloads_recent": c.get("recent_downloads"),
              "crate_versions": {v["num"]: v["downloads"] for v in (crate.get("versions") or [])},
              "release_assets": assets,
          }
          print(json.dumps(out, sort_keys=True))
          PY
          rm -rf raw
          cat snapshot.json

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A dedicated branch, because `main` is protected and a daily bot
          # commit has no business in the project's history anyway.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin metrics --depth=1 2>/dev/null && git checkout metrics \
            || git checkout --orphan metrics
          git rm -rq --cached . 2>/dev/null || true
          [ -f metrics.jsonl ] || : > metrics.jsonl
          # One line per day. A re-run replaces that day rather than duplicating.
          day=$(python3 -c "import json;print(json.load(open('snapshot.json'))['date'])")
          grep -v "\"date\": \"$day\"" metrics.jsonl > tmp.jsonl || true
          cat tmp.jsonl > metrics.jsonl && rm -f tmp.jsonl
          python3 -c "
          import json
          line = json.dumps(json.load(open('snapshot.json')), sort_keys=True)
          open('metrics.jsonl','a').write(line + '\n')
          "
          rm -f snapshot.json
          git add metrics.jsonl
          git commit -qm "metrics: $day" || { echo "nothing changed"; exit 0; }
          git push -q origin metrics
