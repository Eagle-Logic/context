version: 2
updates:
  # Rust dependencies. Grouped so a routine week is one PR, not six — the
  # tree-sitter grammars in particular tend to move together.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      tree-sitter:
        patterns:
          - "tree-sitter*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows below.
  #
  # NOTE: .github/workflows/release.yml is GENERATED by `dist generate`
  # (cargo-dist). If Dependabot bumps an action pin in that file, the next
  # `dist generate` will revert it. Take those PRs on ci.yml; for release.yml,
  # bump `cargo-dist-version` in dist-workspace.toml and regenerate instead.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
