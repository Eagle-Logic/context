version: 2
updates:
  # Rust dependencies. Grouped so a routine week is one PR, not six — the
  # tree-sitter grammars in particular tend to move together.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      tree-sitter:
        patterns:
          - "tree-sitter*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions.
  #
  # Two things here are load-bearing, both learned the hard way.
  #
  # 1. .github/workflows/release.yml is GENERATED by `dist generate`
  #    (cargo-dist), and `dist plan` FAILS CI if its contents drift. Dependabot
  #    edited it once and the release pipeline went red with "release.yml has
  #    out of date contents". Dependabot cannot scope to a single file, so the
  #    only lever is to keep its action set small and bump cargo-dist itself
  #    (`cargo-dist-version` in dist-workspace.toml, then `dist generate`) when
  #    those pins need to move.
  #
  # 2. dtolnay/rust-toolchain is IGNORED below. Its ref doubles as a toolchain
  #    selector, so Dependabot read `@1.85` as an action version and helpfully
  #    "upgraded" the MSRV job to `@1.100` — a Rust release that does not
  #    exist. ci.yml now passes the version as an input instead, but the ignore
  #    stays: nothing good comes of a bot editing that ref.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    ignore:
      # See note 2 above — its ref is a toolchain selector, not a version.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns:
          - "*"
