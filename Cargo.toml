[package]
name = "code-context"
version = "0.20.0"
edition = "2021"
rust-version = "1.85"
description = "ctx — a queryable code graph for coding agents: call graphs, blast radius, API breakage, cross-language port parity"
license = "MIT"
repository = "https://github.com/Eagle-Logic/context"
homepage = "https://github.com/Eagle-Logic/context"
readme = "README.md"
keywords = ["ctx", "call-graph", "agent", "llm", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
