[package]
name = "code-context"
version = "0.28.1"
edition = "2021"
rust-version = "1.90"
description = "ctx — a queryable code graph for coding agents (CLI + MCP server): call graphs, blast radius, API-breakage gates, port parity. Rust, Python, TypeScript, Go, Java. Every answer reports its own completeness."
license = "MIT"
repository = "https://github.com/Eagle-Logic/context"
homepage = "https://github.com/Eagle-Logic/context"
readme = "README.md"
keywords = ["mcp", "call-graph", "static-analysis", "tree-sitter", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ctx"
path = "src/main.rs"

# Name the npm package after the BINARY, as the Homebrew formula is, so the
# command people type matches the thing they heard: `npx @eagle-logic/ctx`.
# Without this the package would take the crate name, `code-context`.
[package.metadata.dist]
npm-package = "ctx"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
