[package]
name = "code-context"
version = "0.17.0"
edition = "2021"
rust-version = "1.85"
description = "Queryable code graph for coding agents: call graphs, blast radius, API breakage, cross-language parity"
license = "MIT"
repository = "https://github.com/Eagle-Logic/context"
readme = "README.md"
keywords = ["call-graph", "code-analysis", "agent", "llm", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true
